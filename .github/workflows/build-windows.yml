name: Build LUKO-AmaFakt.exe (Windows)

on:
  push:
    branches: [main, claude/amazon-reports-merger-0mpcvu]
    paths:
      - "amazon_vat_merger/**"
      - "requirements-merger.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-merger.txt pyinstaller
      - name: Testy (bez próbek klienta)
        run: |
          pip install pytest
          python -m pytest -q
      - name: Budowa LUKO-AmaFakt.exe (okienko)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name LUKO-AmaFakt --paths . --icon assets/icon.ico --add-data "assets/icon.ico;assets"
          --collect-all pdfplumber --collect-all pdfminer --collect-all pypdfium2 --collect-all pypdfium2_raw
          --collect-all openpyxl --collect-all gspread --collect-all google.auth --collect-all charset_normalizer
          amazon_vat_merger/gui_main.py
      - name: Budowa LUKO-AmaFakt-cli.exe (wiersz poleceń)
        run: >
          pyinstaller --noconfirm --clean --onefile --console --name LUKO-AmaFakt-cli --paths . --icon assets/icon.ico
          --collect-all pdfplumber --collect-all pdfminer --collect-all pypdfium2 --collect-all pypdfium2_raw
          --collect-all openpyxl --collect-all gspread --collect-all google.auth --collect-all charset_normalizer
          amazon_vat_merger/cli_main.py
      - name: Test zbudowanego CLI
        run: |
          dist\LUKO-AmaFakt-cli.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: LUKO-AmaFakt-windows
          path: dist/*.exe
          retention-days: 90
